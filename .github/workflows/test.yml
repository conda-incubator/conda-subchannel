name: Test
on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "conda_subchannel/**"
      - "tests/**"
      - "pyproject.toml"
      - "pixi.lock"

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}, py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        python-version: ["311", "312", "313", "314"]
    env:
      PIXI_ENV_NAME: test-py${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: ${{ env.PIXI_ENV_NAME }}
      - name: Setup project
        run: |
          pixi run --environment ${{ env.PIXI_ENV_NAME }} dev
      - name: Run tests
        run: pixi run --environment ${{ env.PIXI_ENV_NAME }} test --basetemp=${{ runner.os == 'Windows' && 'D:\\temp' || runner.temp }}
      - name: Build recipe (${{ env.PIXI_ENV_NAME }})
        if: matrix.python-version == '311'
        run: pixi run build

  action:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to deploy to GH Pages automatically
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./
        with:
          channel: conda-forge
          keep-trees: python=3.14
          gh-pages-branch: ''  # disable on main
